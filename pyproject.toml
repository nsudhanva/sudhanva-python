[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sudhanva"
version = "0.1.0"
description = "Minimal Python client for the public sudhanva.me API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sudhanva Narayana", email = "nsudhanva@gmail.com" }]
keywords = ["sudhanva", "api", "sdk", "agents", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://sudhanva.me"
Documentation = "https://sudhanva.me/developers/sdks/"
Source = "https://github.com/nsudhanva/sudhanva-python"
Issues = "https://github.com/nsudhanva/sudhanva-python/issues"
OpenAPI = "https://sudhanva.me/openapi.json"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sudhanva = ["py.typed"]
